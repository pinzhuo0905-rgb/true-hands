name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # windows-latest 的控制台默认不是 UTF-8，脚本里的 ✓ 和中文会触发
    # UnicodeEncodeError。这两行让整个 job 跑在 UTF-8 模式。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 代码风格检查
        run: ruff check src tests scripts

      - name: 运行测试
        run: pytest -q

      - name: 零依赖自检（不装 pytest 也能跑）
        run: python scripts/selfcheck.py
        env:
          PYTHONPATH: src

      - name: 校验策略规则自洽（白/黑名单无重叠）
        run: python -c "from true_hands.policy.rules import ALLOWED_TOOLS, FORBIDDEN_TOOLS; a={n for g in ALLOWED_TOOLS.values() for n in g}; assert not (a & set(FORBIDDEN_TOOLS)), '白名单与黑名单冲突'; print('OK')"
        env:
          PYTHONPATH: src

      - name: 打印策略清单（便于审查）
        run: python -m true_hands.cli policy
        env:
          PYTHONPATH: src
