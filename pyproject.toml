[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "true-hands"
version = "0.1.0"
description = "An AI that really operates the computer — and can prove it. Built-in desktop driver, UI-only enforcement, project-scoped policy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "true-hands contributors" }]
keywords = ["ai-agent", "gui-automation", "computer-use", "mcp", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
# 更好的截图（PNG、多屏）。不装则退回 GDI/BMP，仍可用。
imaging = [
  "pillow>=10.0",
]
# 想用 .true-hands.yaml 而不是 .true-hands.json
yaml = [
  "pyyaml>=6.0",
]

[project.scripts]
true-hands = "true_hands.cli:app"

[project.urls]
Homepage = "https://github.com/pinzhuo0905-rgb/true-hands"
Issues = "https://github.com/pinzhuo0905-rgb/true-hands/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# 显式锁定规则集：ruff 的默认规则会随版本变化，不锁定的话 CI 会时红时绿
select = ["E", "F", "W", "I", "UP", "RUF"]
ignore = [
  "E501",    # 行长交给 formatter 处理
  "RUF001",  # 全角标点：中文注释与文档字符串里是正常的
  "RUF002",
  "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
